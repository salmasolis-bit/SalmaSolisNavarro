<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Arte en Canvas - Gatito</title>
  <style>
      canvas{
          border: 3px solid rgb(212, 45, 20);
          background-color: rgb(2, 1, 1);
      }
  </style>

<script>
    //window.onload=function(){}
    var x = 0;
    var dx = 3;
    function animate(){
        requestAnimationFrame(animate);
        //console.log('animando');
        var canvas = document.getElementById("micanvas");
        var context = canvas.getContext("2d");
        context.clearRect(0, 0, innerWidth, innerHeight);
        // GATO
        context.fillStyle="red";

        // Cabeza
        context.fillRect(x,180,200,180);

        // Oreja izquierda
        context.fillRect(x,140,50,40);

        // Oreja derecha
        context.fillRect(x+150,140,50,40);

        // Ojos
        context.fillStyle="black";
        context.fillRect(x+45,240,20,20);
        context.fillRect(x+135,240,20,20);

        // Nariz
        context.fillRect(x+90,290,20,15);

        // Texto
        context.font = '30pt Calibri';
        context.fillStyle = 'white';
        context.fillText('Meow!', x+45, 420);

        // Rebote
        if (x > 600 || x < 0){
                dx= -dx;
            }
           x+=dx;
    }
    animate();
</script>

  </head>
<body>
   <canvas id="micanvas" width="800" height="600"></canvas>
</body>
</html>
